services:
  db:
    image: postgres:17-alpine
    container_name: hklx-blog-db
    environment:
      POSTGRES_USER: blog
      POSTGRES_PASSWORD: blog
      POSTGRES_DB: hklx_blog
    ports:
      - "5433:5432" # 5433 so it doesn't clash with a local Postgres on 5432
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
